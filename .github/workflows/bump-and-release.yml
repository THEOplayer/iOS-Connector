name: Bump and release
run-name: >-
  ${{ (inputs.version == '' && 'Not bumping version') || format('Bumping version to {0}', inputs.version) }}
  and ${{ (inputs.dryRun == true && 'validating') || 'releasing' }}
  ${{ (inputs.utilities && inputs.comscore && inputs.conviva && inputs.nielsen && inputs.sideloadedSubtitle && inputs.uplynk && 'all connectors')
  || ((inputs.utilities || inputs.comscore || inputs.conviva || inputs.nielsen || inputs.sideloadedSubtitle || inputs.uplynk)
  && format('[{0}{1}{2}{3}{4}{5}]',
  inputs.utilities && 'Utilities' || '',
  inputs.comscore && (inputs.utilities && ', Comscore' || 'Comscore') || '',
  inputs.conviva && ((inputs.utilities || inputs.comscore) && ', Conviva' || 'Conviva') || '',
  inputs.nielsen && ((inputs.utilities || inputs.comscore || inputs.conviva) && ', Nielsen' || 'Nielsen') || '',
  inputs.sideloadedSubtitle && ((inputs.utilities || inputs.comscore || inputs.conviva || inputs.nielsen) && ', SideloadedSubtitle' || 'SideloadedSubtitle') || '',
  inputs.uplynk && ((inputs.utilities || inputs.comscore || inputs.conviva || inputs.nielsen || inputs.sideloadedSubtitle) && ', Uplynk' || 'Uplynk') || ''))
  || 'no connectors' }} on the self hosted spec repo
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to bump and tag. If unset, then skips version bump and tag.'
        required: false
        type: string
      dryRun:
        description: 'Dry run to only validate without release.'
        required: true
        default: true
        type: boolean
      utilities:
        description: 'Utilities'
        required: false
        default: false
        type: boolean
      comscore:
        description: 'Comscore'
        required: false
        default: false
        type: boolean
      conviva:
        description: 'Conviva'
        required: false
        default: false
        type: boolean
      nielsen:
        description: 'Nielsen'
        required: false
        default: false
        type: boolean
      sideloadedSubtitle:
        description: 'SideloadedSubtitle'
        required: false
        default: false
        type: boolean
      uplynk:
        description: 'Uplynk'
        required: false
        default: false
        type: boolean
jobs:
  Bump-And-Release:
    runs-on: macos-26
    outputs:
      previousVersion: ${{ steps.store_previous_version.outputs.previousVersion }}
    steps:
      - id: select_connectors
        name: Select connectors
        shell: bash
        run: |
          prefix="THEOplayer-Connector"
          connectors=()
          # Conviva and Nielsen need the new Utilities, which a dry run doesn't publish
          skipUtilitiesDependents=false
          if [[ "${{ inputs.dryRun }}" == "true" && "${{ inputs.utilities }}" == "true" ]]; then
            skipUtilitiesDependents=true
          fi
          [[ "${{ inputs.utilities }}" == "true" ]] && connectors+=("$prefix-Utilities.podspec")
          [[ "${{ inputs.comscore }}" == "true" ]] && connectors+=("$prefix-Comscore.podspec")
          [[ "${{ inputs.conviva }}" == "true" && $skipUtilitiesDependents == false ]] && connectors+=("$prefix-Conviva.podspec")
          [[ "${{ inputs.nielsen }}" == "true" && $skipUtilitiesDependents == false ]] && connectors+=("$prefix-Nielsen.podspec")
          [[ "${{ inputs.sideloadedSubtitle }}" == "true" ]] && connectors+=("$prefix-SideloadedSubtitle.podspec")
          [[ "${{ inputs.uplynk }}" == "true" ]] && connectors+=("$prefix-Uplynk.podspec")
          if [[ $skipUtilitiesDependents == true && ( "${{ inputs.conviva }}" == "true" || "${{ inputs.nielsen }}" == "true" ) ]]; then
            echo "::notice::Dry run with Utilities: skipping Conviva and Nielsen (new Utilities version is not published)."
          fi
          if [[ ${#connectors[@]} -eq 0 ]]; then
            echo "::error::Select at least one connector."
            exit 1
          fi
          echo "podspecs=${connectors[*]}" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'
      - name: Log stacks
        run: |
          echo "Log macOS version"
          sw_vers
          echo "Log Xcode version"
          xcodebuild -version
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
      - id: store_previous_version
        name: Store previous version value
        run: |
          previousVersion=$(ruby -r "./THEOplayer-Connector-Version.rb" -e "print_theoplayer_connector_version")
          echo "previousVersion=$previousVersion" >> "$GITHUB_OUTPUT"
      - name: Update the version.json file
        if: inputs.version != ''
        run: sh update_version_json.sh -v ${{ inputs.version }}
      - name: Commit and push the changes made to the version.json file
        if: inputs.version != ''
        run: |
          git add version.json
          git commit -m "update version.json"
          git push
      - name: Update CHANGELOG.md file
        if: inputs.version != '' && inputs.dryRun == false
        run: sh update_changelog.sh -v ${{ inputs.version }}
      - name: Commit and push the changes made to the CHANGELOG.md file
        if: inputs.version != '' && inputs.dryRun == false
        run: sh commit_changelog.sh
      - name: Add and push new git tag
        if: inputs.version != ''
        run: |
          git tag ${{ inputs.version }}
          git push origin ${{ inputs.version }}
      - name: ${{ (inputs.dryRun == true && 'Validate') || 'Release' }} on the self hosted spec repo
        shell: bash
        env:
          CONNECTOR_PODSPECS: ${{ steps.select_connectors.outputs.podspecs }}
        run: |
          read -r -a connectors <<< "$CONNECTOR_PODSPECS"
          if [[ "${{ inputs.dryRun }}" == "true" ]]; then
            trap 'git checkout -- "${connectors[@]}"' EXIT
          else
            if [ -d "$HOME/.cocoapods/repos/cocoapods-specs" ]; then
              pod repo remove cocoapods-specs
            fi
            pod repo add cocoapods-specs \
            https://x-access-token:${{ secrets.PODS_SPEC_REPO_TOKEN }}@github.com/THEOplayer/cocoapods-specs.git
          fi
          for connector in "${connectors[@]}"
          do
            pod repo update
            options=(--verbose --allow-warnings)
            sources="https://github.com/THEOplayer/cocoapods-specs.git,https://cdn.cocoapods.org"
            if [[ $connector == *Nielsen.podspec ]]; then
              sources+=",https://github.com/NielsenDigitalSDK/nielsenappsdk-ios-specs-dynamic.git"
              options+=(--skip-import-validation)
            fi
            if [[ "${{ inputs.dryRun }}" == "true" ]]; then
              branch=$(git rev-parse --abbrev-ref HEAD)
              sed -i '' "s|:tag => [^,}]*|:branch => \"$branch\"|g" "$connector"
              pod spec lint "$connector" "${options[@]}" --private --sources="$sources"
              git checkout -- "$connector"
            else
              pod repo push cocoapods-specs "$connector" "${options[@]}" --use-json --sources="$sources"
            fi
          done
  Cleanup:
    needs: Bump-And-Release
    if: (inputs.dryRun == true && inputs.version != '' && needs.Bump-And-Release.outputs.previousVersion != '') && (success() || failure())
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
      - name: Update to latest
        run: |
          git fetch --all
          git pull
      - name: Remove and unpublish git tag
        run: git push --delete origin refs/tags/${{ inputs.version }}
      - name: Update(Revert) the version.json file back to the previous version
        env:
          PREVIOUS_VERSION: ${{ needs.Bump-And-Release.outputs.previousVersion }}
        run: |
          sh update_version_json.sh -v $PREVIOUS_VERSION
      - name: Commit and push the changes made to the version.json file
        run: |
          diff=$(git diff version.json)
          if [[ $diff != '' ]]; then
            git add version.json
            git commit -m "update version.json"
            git push
          fi
